name: Release CV

on:
  push:
    tags: ['v*']

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download cv.pdf
        uses: actions/download-artifact@v8
        with:
          name: cv

      - name: Compute SHA-256
        run: sha256sum cv.pdf > cv.pdf.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cv.pdf cv.pdf.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "SHA-256 of \`cv.pdf\`: \`$(cut -d ' ' -f 1 cv.pdf.sha256)\`"
