name: Build CV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compile cv.tex
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv.tex
          latexmk_use_xelatex: true

      - name: Upload cv.pdf
        uses: actions/upload-artifact@v7
        with:
          name: cv
          path: cv.pdf
          if-no-files-found: error
